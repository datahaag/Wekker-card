      saved_id: "{{ states('input_text.sonos_alarm_media_uri') }}"
      desired_options: "{{ ['Handmatige URI / eigen stream'] + favorites }}"
      current_options: "{{ state_attr('input_select.sonos_alarm_favorite_select', 'options') | default([], true) }}"
      saved_label: >-
        {% set ns = namespace(label='') %}
        {% for label in favorites %}
          {% if label.endswith(' — ' ~ saved_id) %}
            {% set ns.label = label %}
          {% endif %}
        {% endfor %}
        {{ ns.label }}
    actions:
      - if:
          - condition: template
            value_template: >-
              {{ states('input_select.sonos_alarm_favorite_select') not in desired_options }}
        then:
          - if:
              - condition: template
                value_template: "{{ 'Handmatige URI / eigen stream' not in current_options }}"
            then:
              - action: input_select.set_options
                target:
                  entity_id: input_select.sonos_alarm_favorite_select
                data:
                  options: "{{ (current_options + ['Handmatige URI / eigen stream']) | unique | list }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.sonos_alarm_favorite_select
            data:
              option: Handmatige URI / eigen stream
      - if:
          - condition: template
            value_template: >-
              {{ state_attr('input_select.sonos_alarm_favorite_select', 'options') != desired_options }}
        then:
          - action: input_select.set_options
            target:
              entity_id: input_select.sonos_alarm_favorite_select
            data:
              options: "{{ desired_options }}"
      - if:
          - condition: template
            value_template: "{{ saved_label | length > 0 }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.sonos_alarm_favorite_select
            data:
              option: "{{ saved_label }}"
        else:
          - action: input_select.select_option
            target:
              entity_id: input_select.sonos_alarm_favorite_select
            data:
              option: Handmatige URI / eigen stream

