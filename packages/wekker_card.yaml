  - id: sonos_smart_alarm_store_light
    alias: Sonos wekker - geselecteerde lamp of schakelaar bewaren
    description: Bewaart de entity-ID achter de lichtwekkerdropdownwaarde.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.sonos_alarm_light_select
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state is not none and
             (' — light.' in trigger.to_state.state or
              ' — switch.' in trigger.to_state.state or
              trigger.to_state.state == 'Geen lamp of schakelaar geselecteerd') }}
    actions:
      - variables:
          new_light: >-
            {{ trigger.to_state.state.split(' — ')[-1]
               if ' — light.' in trigger.to_state.state or ' — switch.' in trigger.to_state.state else '' }}
          old_light: >-
            {{ trigger.from_state.state.split(' — ')[-1]
               if trigger.from_state is not none and
                  (' — light.' in trigger.from_state.state or ' — switch.' in trigger.from_state.state) else '' }}
      - if:
          - condition: template
            value_template: >-
              {{ (old_light.startswith('light.') or old_light.startswith('switch.')) and
                 old_light != new_light and
                 is_state('input_boolean.sonos_alarm_light_enabled', 'on') and
                 states('input_select.sonos_alarm_status') in ['ramping', 'ringing'] }}
        then:
          - action: homeassistant.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ old_light }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.sonos_alarm_light
        data:
          value: "{{ new_light }}"

  - id: sonos_smart_alarm_discover_favorites
