# Wekker-card — native Home Assistant package voor Sonos en licht
# Adjust defaults from the dashboard after installation.

input_boolean:
  sonos_alarm_enabled:
    name: Wekker aan
    icon: mdi:alarm-check
  sonos_alarm_initialized:
    name: Sonos wekker geïnitialiseerd
    icon: mdi:database-check
  sonos_alarm_light_enabled:
    name: Lichtwekker aan
    icon: mdi:lightbulb-on-outline
  sonos_alarm_light_initialized:
    name: Lichtwekker geïnitialiseerd
    icon: mdi:database-check

input_datetime:
  sonos_alarm_weekday_time:
    name: Wektijd maandag t/m vrijdag
    has_date: false
    has_time: true
  sonos_alarm_weekend_time:
    name: Wektijd zaterdag en zondag
    has_date: false
    has_time: true
  sonos_alarm_target:
    name: Actuele wekkerdoeltijd
    has_date: true
    has_time: true
  sonos_alarm_start:
    name: Starttijd van de actuele wekcyclus
    has_date: true
    has_time: true
  sonos_alarm_snooze_until:
    name: Snooze tot
    has_date: true
    has_time: true

input_number:
  sonos_alarm_start_volume:
    name: Startvolume
    icon: mdi:volume-low
    min: 1
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
  sonos_alarm_normal_volume:
    name: Normaal wekvolume
    icon: mdi:volume-high
    min: 1
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
  sonos_alarm_ramp_minutes:
    name: Opbouwtijd
    icon: mdi:chart-line
    min: 1
    max: 60
    step: 1
    mode: box
    unit_of_measurement: min
  sonos_alarm_step_interval:
    name: Volume-interval
    icon: mdi:timer-outline
    min: 1
    max: 300
    step: 1
    mode: box
    unit_of_measurement: s
  sonos_alarm_snooze_minutes:
    name: Snoozeduur
    icon: mdi:sleep
    min: 1
    max: 60
    step: 1
    mode: box
    unit_of_measurement: min
  sonos_alarm_light_brightness:
    name: Doelhelderheid lichtwekker
    icon: mdi:brightness-6
    min: 1
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"

input_text:
  sonos_alarm_speaker:
    name: Sonos media_player entity-ID
    icon: mdi:speaker
    max: 100
  sonos_alarm_media_uri:
    name: Radio- of muziek-URI
    icon: mdi:music
    max: 255
  sonos_alarm_cycle:
    name: Actuele cyclus-ID
    max: 40
  sonos_alarm_stopped_cycle:
    name: Gestopte cyclus-ID
    max: 40
  sonos_alarm_light:
    name: Geselecteerde lamp of schakelaar entity-ID
    icon: mdi:lightbulb
    max: 100

input_select:
  sonos_alarm_speaker_select:
    name: Sonos-speler
    icon: mdi:speaker-multiple
    options:
      - Geen Sonos-speler geselecteerd
  sonos_alarm_light_select:
    name: Lamp of schakelaar voor lichtwekker
    icon: mdi:lightbulb-group
    options:
      - Geen lamp of schakelaar geselecteerd
  sonos_alarm_favorite_select:
    name: Sonos-favoriet of radiostation
    icon: mdi:radio
    options:
      - Handmatige URI / eigen stream
  sonos_alarm_media_type:
    name: Mediatype
    icon: mdi:playlist-music
    options:
      - music
      - playlist
      - favorite_item_id
  sonos_alarm_status:
    name: Wekkerstatus
    icon: mdi:alarm
    options:
      - idle
      - ramping
      - ringing
      - snoozed

script:
  sonos_alarm_play:
    alias: Sonos wekker - speel gekozen media
    mode: restart
    sequence:
      - action: media_player.volume_set
        target:
          entity_id: "{{ states('input_text.sonos_alarm_speaker') }}"
        data:
          volume_level: "{{ volume | float(0.01) }}"
      - action: media_player.play_media
        target:
          entity_id: "{{ states('input_text.sonos_alarm_speaker') }}"
        data:
          media_content_id: "{{ states('input_text.sonos_alarm_media_uri') }}"
          media_content_type: "{{ states('input_select.sonos_alarm_media_type') }}"
          enqueue: replace

  sonos_alarm_set_light:
    alias: Sonos wekker - zet berekend lichtniveau
    description: Zet de gekozen lamp alleen wanneer de berekende doelhelderheid afwijkt.
    mode: restart
    sequence:
      - variables:
          light_entity: "{{ states('input_text.sonos_alarm_light') }}"
          requested: "{{ brightness_pct | float(0) }}"
          desired: >-
            {{ [100, [0, requested | float(0)] | max] | min if is_state('input_boolean.sonos_alarm_light_enabled', 'on') else 0 }}
          current: >-
            {% set value = state_attr(light_entity, 'brightness') %}
            {{ (value / 255 * 100) if value is number else 0 }}
      - condition: template
        value_template: >-
          {{ (light_entity.startswith('light.') or light_entity.startswith('switch.')) and
             has_value(light_entity) }}
      - choose:
          - conditions: "{{ desired | float <= 0 }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ not is_state(light_entity, 'off') }}"
                then:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ light_entity }}"
          - conditions: "{{ desired | float > 0 and light_entity.startswith('switch.') }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ not is_state(light_entity, 'on') }}"
                then:
                  - action: switch.turn_on
                    target:
                      entity_id: "{{ light_entity }}"
          - conditions: >-
              {{ desired | float > 0 and light_entity.startswith('light.') and
                 (not is_state(light_entity, 'on') or (current | float - desired | float) | abs > 1) }}
            sequence:
              - action: light.turn_on
                target:
                  entity_id: "{{ light_entity }}"
                data:
                  brightness_pct: "{{ desired | round(0) | int }}"

  sonos_alarm_snooze:
    alias: Sonos wekker - SNOOZE
    icon: mdi:sleep
    mode: restart
    sequence:
      - condition: template
        value_template: >-
          {{ states('input_select.sonos_alarm_status') in ['ramping', 'ringing'] }}
      - action: script.turn_off
        continue_on_error: true
        target:
          entity_id: script.sonos_alarm_run_ramp
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.sonos_alarm_snooze_until
        data:
          datetime: >-
            {{ (now() + timedelta(minutes=states('input_number.sonos_alarm_snooze_minutes') | int(9))).strftime('%Y-%m-%d %H:%M:%S') }}
      - action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: "{{ states('input_text.sonos_alarm_speaker') }}"
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: "{{ states('input_text.sonos_alarm_speaker') }}"
        data:
          volume_level: 0
      - action: script.sonos_alarm_set_light
        data:
          brightness_pct: 0
      - action: input_select.select_option
        target:
          entity_id: input_select.sonos_alarm_status
        data:
          option: snoozed

  sonos_alarm_stop:
    alias: Sonos wekker - STOP
    icon: mdi:stop-circle
    mode: restart
    sequence:
      - action: script.turn_off
        continue_on_error: true
        target:
          entity_id: script.sonos_alarm_run_ramp
      - variables:
          cycle: "{{ states('input_text.sonos_alarm_cycle') }}"
      - if:
          - condition: template
            value_template: "{{ cycle not in ['', 'unknown', 'unavailable'] }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.sonos_alarm_stopped_cycle
            data:
              value: "{{ cycle }}"
      - action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: "{{ states('input_text.sonos_alarm_speaker') }}"
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: "{{ states('input_text.sonos_alarm_speaker') }}"
        data:
          volume_level: 0
      - action: script.sonos_alarm_set_light
        data:
          brightness_pct: 0
      - action: input_select.select_option
        target:
          entity_id: input_select.sonos_alarm_status
        data:
          option: idle
      - if:
          - condition: state
            entity_id: input_boolean.sonos_alarm_enabled
            state: "on"
        then:
          - action: script.sonos_alarm_schedule_next

  sonos_alarm_context_button:
    alias: Sonos wekker - contextknop
    icon: mdi:gesture-tap-button
    mode: single
    sequence:
      - choose:
          - conditions: "{{ states('input_select.sonos_alarm_status') in ['ramping', 'ringing'] }}"
            sequence:
              - action: script.sonos_alarm_snooze
          - conditions: "{{ is_state('input_select.sonos_alarm_status', 'snoozed') }}"
            sequence:
              - action: script.sonos_alarm_stop

  sonos_alarm_schedule_next:
    alias: Sonos wekker - plan volgende wekcyclus
    description: Berekent één keer de exacte start- en doeltijd; er is geen periodieke controller nodig.
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.sonos_alarm_enabled
        state: "on"
      - variables:
          now_ts: "{{ as_timestamp(now()) }}"
          ramp_seconds: "{{ states('input_number.sonos_alarm_ramp_minutes') | int(15) * 60 }}"
          today_time: >-
            {{ states('input_datetime.sonos_alarm_weekday_time') if now().weekday() < 5 else states('input_datetime.sonos_alarm_weekend_time') }}
          tomorrow_date: "{{ (now().date() + timedelta(days=1)).isoformat() }}"
          tomorrow_weekday: "{{ (now().weekday() + 1) % 7 }}"
          tomorrow_time: >-
            {{ states('input_datetime.sonos_alarm_weekday_time') if tomorrow_weekday | int < 5 else states('input_datetime.sonos_alarm_weekend_time') }}
      - variables:
          today_target: "{{ as_timestamp(strptime(now().date().isoformat() ~ ' ' ~ today_time, '%Y-%m-%d %H:%M:%S')) }}"
          tomorrow_target: "{{ as_timestamp(strptime(tomorrow_date ~ ' ' ~ tomorrow_time, '%Y-%m-%d %H:%M:%S')) }}"
      - variables:
          target_ts: "{{ today_target if now_ts | float < today_target | float else tomorrow_target }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.sonos_alarm_target
        data:
          datetime: "{{ target_ts | float | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.sonos_alarm_start
        data:
          datetime: "{{ (target_ts | float - ramp_seconds | float) | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}"

  sonos_alarm_run_ramp:
    alias: Sonos wekker - voer actieve volume- en lichtramp uit
    description: Stuurt alleen tijdens een actieve wekcyclus apparaatstappen; schrijft geen periodieke statussen.
    mode: restart
    sequence:
      - variables:
          speaker: "{{ states('input_text.sonos_alarm_speaker') }}"
          media_id: "{{ states('input_text.sonos_alarm_media_uri') }}"
          target_ts: "{{ as_timestamp(states('input_datetime.sonos_alarm_target'), 0) }}"
          start_ts: "{{ as_timestamp(states('input_datetime.sonos_alarm_start'), 0) }}"
          interval: "{{ states('input_number.sonos_alarm_step_interval') | int(30) }}"
          start_volume: "{{ states('input_number.sonos_alarm_start_volume') | float(2) / 100 }}"
          normal_volume: "{{ states('input_number.sonos_alarm_normal_volume') | float(30) / 100 }}"
          target_brightness: "{{ states('input_number.sonos_alarm_light_brightness') | float(70) }}"
          cycle: "{{ target_ts | float(0) | timestamp_custom('%Y-%m-%dT%H:%M:%S', true) }}"
      - condition: template
        value_template: >-
          {{ is_state('input_boolean.sonos_alarm_enabled', 'on') and
             speaker.startswith('media_player.') and media_id not in ['', 'unknown', 'unavailable'] and
             target_ts | float > as_timestamp(now()) and
             states('input_text.sonos_alarm_stopped_cycle') != cycle }}
      - action: input_text.set_value
        target:
          entity_id: input_text.sonos_alarm_cycle
        data:
          value: "{{ cycle }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.sonos_alarm_status
        data:
          option: ramping
      - variables:
          first_fraction: >-
            {{ [1, [0, (as_timestamp(now()) - start_ts | float) / [1, target_ts | float - start_ts | float] | max] | max] | min }}
          first_volume: "{{ start_volume | float + (normal_volume | float - start_volume | float) * first_fraction | float }}"
      - action: script.sonos_alarm_play
        data:
          volume: "{{ first_volume }}"
      - repeat:
          while:
            - condition: template
              value_template: >-
                {{ is_state('input_boolean.sonos_alarm_enabled', 'on') and
                   is_state('input_select.sonos_alarm_status', 'ramping') and
                   states('input_text.sonos_alarm_stopped_cycle') != cycle and
                   as_timestamp(now()) < target_ts | float }}
          sequence:
            - variables:
                fraction: >-
                  {{ [1, [0, (as_timestamp(now()) - start_ts | float) / [1, target_ts | float - start_ts | float] | max] | max] | min }}
                desired_volume: "{{ start_volume | float + (normal_volume | float - start_volume | float) * fraction | float }}"
                desired_brightness: "{{ target_brightness | float * fraction | float }}"
            - if:
                - condition: template
                  value_template: >-
                    {% set current = state_attr(speaker, 'volume_level') %}
                    {{ current is not number or (current - desired_volume | float) | abs > 0.004 }}
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: "{{ speaker }}"
                  data:
                    volume_level: "{{ desired_volume }}"
            - action: script.sonos_alarm_set_light
              data:
                brightness_pct: "{{ desired_brightness }}"
            - delay:
                seconds: "{{ interval }}"
      - if:
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.sonos_alarm_enabled', 'on') and
                 is_state('input_select.sonos_alarm_status', 'ramping') and
                 states('input_text.sonos_alarm_stopped_cycle') != cycle and
                 as_timestamp(now()) >= target_ts | float }}
        then:
          - action: script.sonos_alarm_ring

  sonos_alarm_ring:
    alias: Sonos wekker - bereik normaal wekvolume
    mode: restart
    sequence:
      - variables:
          speaker: "{{ states('input_text.sonos_alarm_speaker') }}"
          target_ts: "{{ as_timestamp(states('input_datetime.sonos_alarm_target'), 0) }}"
          cycle: "{{ target_ts | float(0) | timestamp_custom('%Y-%m-%dT%H:%M:%S', true) }}"
          normal_volume: "{{ states('input_number.sonos_alarm_normal_volume') | float(30) / 100 }}"
      - condition: template
        value_template: >-
          {{ is_state('input_boolean.sonos_alarm_enabled', 'on') and
             speaker.startswith('media_player.') and
             states('input_text.sonos_alarm_stopped_cycle') != cycle }}
      - if:
          - condition: template
            value_template: "{{ states(speaker) not in ['playing', 'buffering'] }}"
        then:
          - action: script.sonos_alarm_play
            data:
              volume: "{{ normal_volume }}"
        else:
          - action: media_player.volume_set
            continue_on_error: true
            target:
              entity_id: "{{ speaker }}"
            data:
              volume_level: "{{ normal_volume }}"
      - action: script.sonos_alarm_set_light
        data:
          brightness_pct: "{{ states('input_number.sonos_alarm_light_brightness') | float(70) }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.sonos_alarm_status
        data:
          option: ringing

  sonos_alarm_refresh_lists:
    alias: Sonos wekker - keuzelijsten handmatig verversen
    description: Werkt spelers, alle light-entities en Sonos-favorieten alleen op verzoek bij.
    mode: single
    sequence:
      - event: wekker_card_refresh_lists

automation:
  - id: sonos_smart_alarm_initialize
    alias: Sonos wekker - eenmalige standaardwaarden
    description: Stelt defaults alleen bij de eerste installatie in; daarna herstellen helpers hun vorige staat.
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.sonos_alarm_initialized
        state: "off"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.sonos_alarm_weekday_time
        data:
          time: "07:00:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.sonos_alarm_weekend_time
        data:
          time: "09:00:00"
      - action: input_number.set_value
        target:
          entity_id: input_number.sonos_alarm_start_volume
        data:
          value: 2
      - action: input_number.set_value
        target:
          entity_id: input_number.sonos_alarm_normal_volume
        data:
          value: 30
      - action: input_number.set_value
        target:
          entity_id: input_number.sonos_alarm_ramp_minutes
        data:
          value: 15
      - action: input_number.set_value
        target:
          entity_id: input_number.sonos_alarm_step_interval
        data:
          value: 30
      - action: input_number.set_value
        target:
          entity_id: input_number.sonos_alarm_snooze_minutes
        data:
          value: 9
      - action: input_text.set_value
        target:
          entity_id: input_text.sonos_alarm_speaker
        data:
          value: media_player.slaapkamer
      - action: input_text.set_value
        target:
          entity_id: input_text.sonos_alarm_media_uri
        data:
          value: "https://example.com/radio-stream.mp3"
      - action: input_select.select_option
        target:
          entity_id: input_select.sonos_alarm_media_type
        data:
          option: music
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.sonos_alarm_initialized

  - id: sonos_smart_alarm_initialize_light
    alias: Sonos wekker - eenmalige lichtwekkerstandaard
    description: Initialiseert nieuwe lichtwekkerhelpers ook veilig bij upgrades vanaf een oudere versie.
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.sonos_alarm_light_initialized
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.sonos_alarm_light_brightness
        data:
          value: 70
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.sonos_alarm_light_enabled
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.sonos_alarm_light_initialized

  - id: sonos_smart_alarm_controller
    alias: Sonos wekker - gebeurtenisgestuurde controller
    description: Reageert uitsluitend op exacte alarmtijden, Home Assistant-start en gewijzigde gebruikersinstellingen.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time
        at: input_datetime.sonos_alarm_start
        id: alarm_start
      - trigger: time
        at: input_datetime.sonos_alarm_target
        id: alarm_target
      - trigger: time
        at: input_datetime.sonos_alarm_snooze_until
        id: snooze_end
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: state
        entity_id:
          - input_boolean.sonos_alarm_enabled
          - input_datetime.sonos_alarm_weekday_time
          - input_datetime.sonos_alarm_weekend_time
          - input_number.sonos_alarm_ramp_minutes
        id: schedule_changed
      - trigger: state
        entity_id:
          - input_number.sonos_alarm_start_volume
          - input_number.sonos_alarm_normal_volume
          - input_number.sonos_alarm_step_interval
          - input_boolean.sonos_alarm_light_enabled
          - input_number.sonos_alarm_light_brightness
          - input_text.sonos_alarm_light
        id: ramp_changed
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'alarm_start' }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.sonos_alarm_run_ramp
          - conditions: >-
              {{ trigger.id == 'alarm_target' and
                 not is_state('input_select.sonos_alarm_status', 'snoozed') }}
            sequence:
              - action: script.sonos_alarm_ring
          - conditions: >-
              {{ trigger.id == 'snooze_end' and is_state('input_select.sonos_alarm_status', 'snoozed') }}
            sequence:
              - action: script.sonos_alarm_ring
          - conditions: "{{ trigger.id == 'ramp_changed' and is_state('input_select.sonos_alarm_status', 'ramping') }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.sonos_alarm_run_ramp
          - conditions: >-
              {{ trigger.id in ['startup', 'schedule_changed'] and
                 not is_state('input_boolean.sonos_alarm_enabled', 'on') }}
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ states('input_select.sonos_alarm_status') != 'idle' }}"
                then:
                  - action: script.sonos_alarm_stop
          - conditions: "{{ trigger.id in ['startup', 'schedule_changed'] }}"
            sequence:
              - condition: template
                value_template: >-
                  {{ not (is_state('input_select.sonos_alarm_status', 'snoozed') and
                          as_timestamp(states('input_datetime.sonos_alarm_snooze_until'), 0) > as_timestamp(now())) }}
              - action: script.sonos_alarm_schedule_next
              - if:
                  - condition: template
                    value_template: >-
                      {{ as_timestamp(states('input_datetime.sonos_alarm_start'), 0) <= as_timestamp(now()) and
                         as_timestamp(now()) < as_timestamp(states('input_datetime.sonos_alarm_target'), 0) }}
                then:
                  - action: script.turn_on
                    target:
                      entity_id: script.sonos_alarm_run_ramp

  - id: sonos_smart_alarm_refresh_lists_on_start
    alias: Sonos wekker - keuzelijsten eenmaal laden na start
    description: Eenmalige, vertraagde inventarisatie zodat integraties eerst volledig kunnen laden.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:15"
      - action: script.sonos_alarm_refresh_lists

  - id: sonos_smart_alarm_discover_speakers
    alias: Sonos wekker - Sonos-spelers zoeken
    description: Vult de dashboardkeuzelijst uitsluitend met media_players uit de Sonos-integratie.
    mode: restart
    triggers:
      - trigger: event
        event_type: wekker_card_refresh_lists
    variables:
      speakers: >-
        {% set ns = namespace(items=[]) %}
        {% for entity in integration_entities('sonos') | sort %}
          {% if entity.startswith('media_player.') %}
            {% set label = (state_attr(entity, 'friendly_name') | default(entity, true)) ~ ' — ' ~ entity %}
            {% set ns.items = ns.items + [label] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}
