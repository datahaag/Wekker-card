name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  test-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check JavaScript syntax
        run: node --check custom_components/wekker_card/frontend/wekker-card.js
      - name: Run card resource tests
        run: node tests/test_resource_registration.js
      - name: Run Python contract tests
        run: |
          python tests/test_algorithm.py
          python tests/test_ramp_interval.py
          python tests/test_stop_targets.py
          python tests/test_dashboard_contract.py
          python tests/test_release_contract.py
